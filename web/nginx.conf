server {
    listen 80;
    server_name raspberrypi.local raspberrypi _;

    root /var/www/bambupi;   # Symlink → /home/bambupi/bambupi/web
    index index.php;

    # PHP-Seiten
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Node.js API (MQTT, SSE, Datei-Upload, Kamera-Stream)
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';        # SSE: keep-alive
        proxy_set_header   Host localhost:3000;
        proxy_buffering    off;                  # SSE: kein Buffer
        proxy_read_timeout 3600s;
    }

    # Uploads direkt ausliefern
    location /uploads/ {
        alias /home/bambupi/bambupi/uploads/;
    }

    # Timelapses direkt ausliefern
    location /public/timelapses/ {
        alias /home/bambupi/bambupi/public/timelapses/;
        add_header Content-Type video/mp4;
    }

    # Statische Assets cachen
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Kein Zugriff auf .env, .git etc.
    location ~ /\. { deny all; }
}
