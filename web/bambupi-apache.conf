<VirtualHost *:80>
    ServerName raspberrypi.local
    ServerAlias raspberrypi _

    DocumentRoot /var/www/bambupi
    DirectoryIndex index.php

    <Directory /var/www/bambupi>
        Options -Indexes
        AllowOverride None
        Require all granted

        # PHP direkt durch mod_php
    </Directory>

    # Uploads aus dem bambupi-Verzeichnis ausliefern
    Alias /uploads /home/bambupi/bambupi/uploads
    <Directory /home/bambupi/bambupi/uploads>
        Options -Indexes
        Require all granted
    </Directory>

    # Node.js API (MQTT, SSE, Datei-Upload, Kamera)
    ProxyRequests Off
    ProxyPreserveHost Off

    # SSE benötigt kein Buffering
    SetEnv proxy-nokeepalive 1
    SetEnv proxy-initial-not-pooled 1

    ProxyPass        /api/ http://127.0.0.1:3000/api/
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/

    # Streams (go2rtc)
    ProxyPass        /streams/ http://127.0.0.1:3000/streams/
    ProxyPassReverse /streams/ http://127.0.0.1:3000/streams/

    # Sicherheit: keine versteckten Dateien
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/bambupi_error.log
    CustomLog ${APACHE_LOG_DIR}/bambupi_access.log combined
</VirtualHost>
